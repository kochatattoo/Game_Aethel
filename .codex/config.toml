[mcp_servers.mcp-unity]
command = "node"
args = ["Packages/com.gamelovers.mcp-unity/Server~/build/index.js"]
env = { MCP_UNITY_SETTINGS_PATH = "D:/UnityPetProject/PetProject/ProjectSettings/McpUnitySettings.json", MCP_UNITY_AUTH_TOKEN_PATH = "D:/UnityPetProject/PetProject/Library/McpUnity/bridge-token" }

[mcp_servers.token-optimizer]
command = "C:/Program Files/nodejs/node.exe"
cwd = "D:/UnityPetProject/PetProject"
args = [".codex/scripts/run-token-optimizer.mjs"]
enabled = true
startup_timeout_sec = 25
tool_timeout_sec = 30
omit_tools_from = ["direct"]
enabled_tools = ["smart_read", "smart_glob", "smart_grep", "expand", "get_optimization_report"]

# Другой Unity MCP отключён только для Aethel.
[mcp_servers.unityMCP]
enabled = false
